name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    # システム依存関係のインストール (eframe/egui に必要なライブラリ)
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libx11-xcb-dev libxext-dev

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check
      continue-on-error: true # フォーマットエラーでCIを即終了させない場合は true にする

    - name: Run Clippy (Lint)
      run: cargo clippy -- -D warnings
      continue-on-error: true # 開発初期はWarningで落ちないようにする

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose
