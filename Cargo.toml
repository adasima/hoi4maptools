[package]
name = "world_smith"
version = "0.1.0"
edition = "2021"
description = "HoI4 Map Architect - Vector-first map editing tool"

[dependencies]
# GUI
eframe = { version = "0.31", features = ["wgpu"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["image"] }

# Image handling (lossless BMP)
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }

# Data parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"

# File dialogs
rfd = "0.15"

# Error handling & logging
anyhow = "1"
log = "0.4"
env_logger = "0.11"

# Deterministic RNG
rand = "0.8"
rand_xoshiro = "0.6"

# i18n (internationalization)
fluent = "0.16"
fluent-langneg = "0.14"
unic-langid = "0.9"
intl-memoizer = "0.5"

# Spatial indexing
rstar = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "app_bench"
harness = false
